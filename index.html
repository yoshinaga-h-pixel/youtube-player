<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>QRで動画再生</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root { --bg:#1d2433; --ink:#f2efe6; --muted:#9aa3b5; --accent:#ffc93c; --danger:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#000; color:var(--ink); overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-user-select:none; user-select:none; }
  .screen { position:fixed; inset:0; display:none; }
  .screen.active { display:flex; }

  #start { background:var(--bg); flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; text-align:center; }
  #start h1 { font-size:1.7rem; line-height:1.5; }
  #start p { color:var(--muted); line-height:1.8; font-size:.95rem; }
  button { font:inherit; border:none; cursor:pointer; }
  .primary { background:var(--accent); color:var(--bg); font-weight:700; font-size:1.2rem; padding:18px 48px; border-radius:999px; }

  #scan { align-items:center; justify-content:center; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .frame { position:relative; flex:none; width:68vmin; height:68vmin; border-radius:24px; border:4px solid var(--accent);
    box-shadow:0 0 0 100vmax rgba(0,0,0,.5); }
  .scan-msg { position:absolute; z-index:2; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 40px);
    text-align:center; font-size:1.05rem; padding:0 16px; font-weight:600; line-height:1.6; }
  .scan-msg.error { color:var(--danger); }

  #play { align-items:center; justify-content:center; }
  #player-wrap { position:absolute; inset:0; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  #player-wrap iframe, #player { width:100%; height:100%; display:block; }
  #backBtn { position:absolute; z-index:5; top:calc(env(safe-area-inset-top) + 10px); right:12px;
    background:rgba(40,40,40,.75); color:var(--ink); padding:10px 16px; border-radius:999px; font-size:.9rem; }
  /* 「タップして再生」案内。タップは下の動画に通す */
  #tapHint { position:absolute; z-index:4; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 48px);
    text-align:center; pointer-events:none; }
  #tapHint span { display:inline-block; background:var(--accent); color:var(--bg); font-weight:700;
    padding:12px 24px; border-radius:999px; font-size:1.05rem; }

  /* ===== 横画面 ===== */
  @media (orientation: landscape) {
    #start { flex-direction:row; gap:48px;
      padding:24px calc(env(safe-area-inset-right) + 32px) 24px calc(env(safe-area-inset-left) + 32px); text-align:left; }
    #start h1 { font-size:clamp(1.3rem, 4.2vh + 1vw, 2.2rem); }
    #start .text { display:flex; flex-direction:column; gap:12px; max-width:50%; }

    /* 枠を左寄せ、文章は右側の余白に置いて重ならないようにする */
    #scan { justify-content:flex-start;
      padding-left:calc(env(safe-area-inset-left) + 8vw); }
    .frame { width:min(78vh, 45vw); height:min(78vh, 45vw); }
    .scan-msg { left:auto; bottom:auto; top:50%; transform:translateY(-50%);
      right:calc(env(safe-area-inset-right) + 5vw);
      width:calc(100vw - min(78vh, 45vw) - 8vw - 10vw - env(safe-area-inset-left) - env(safe-area-inset-right));
      text-align:left; font-size:clamp(1rem, 2.6vw, 1.6rem); padding:0; }

    #player-wrap { padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left); }
    #backBtn { top:12px; right:calc(env(safe-area-inset-right) + 12px); }
    #tapHint { bottom:24px; }
  }
</style>
</head>
<body>

<section id="start" class="screen active">
  <div class="text">
    <h1>QRコードをかざすと<br>動画が始まります</h1>
    <p>動画が終わると、読み取り画面に戻ります。</p>
    <p style="font-size:.75rem;opacity:.6">ver 5（インカメ版）</p>
  </div>
  <button class="primary" id="startBtn">カメラを起動</button>
</section>

<section id="scan" class="screen">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame" aria-hidden="true"></div>
  <p class="scan-msg" id="scanMsg">枠の中に<br>QRコードを<br>合わせてください</p>
</section>

<section id="play" class="screen">
  <div id="player-wrap"><div id="player"></div></div>
  <div id="tapHint"><span>▶ 動画をタップして再生</span></div>
  <button id="backBtn">読み取りに戻る</button>
</section>

<canvas id="canvas" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let stream = null, scanning = false, player = null, ytReady = false, pendingId = null, lastErrorAt = 0;

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }

// YouTube IFrame API 読み込み
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => { ytReady = true; if (pendingId) playVideo(pendingId); };

function extractVideoId(text) {
  text = text.trim();
  if (/^[\w-]{11}$/.test(text)) return text;
  try {
    const u = new URL(text);
    const host = u.hostname.replace(/^(www|m|music)\./, '');
    if (host === 'youtu.be') return u.pathname.slice(1, 12);
    if (host.endsWith('youtube.com') || host === 'youtube-nocookie.com') {
      if (u.searchParams.get('v')) return u.searchParams.get('v');
      const m = u.pathname.match(/\/(shorts|embed|live|v)\/([\w-]{11})/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
}

// カメラ：iPhoneは止めるたびに許可を聞き直すことがあるので、一度起動したら付けっぱなし
async function ensureCamera() {
  if (stream && stream.getVideoTracks().some(t => t.readyState === 'live')) return true;
  try {
    // インカメを確実に選ぶ（exact指定→だめなら通常指定）
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'user' } }, audio: false });
    } catch (e1) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    }
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    show('start');
    alert('カメラを起動できませんでした。\n・Safariで https のページを開いているか\n・設定 > Safari > カメラ が「許可」か\nを確認してください。');
    return false;
  }
}

async function startScanning() {
  show('scan');
  $('scanMsg').innerHTML = '枠の中に<br>QRコードを<br>合わせてください';
  $('scanMsg').classList.remove('error');
  if (!(await ensureCamera())) return;
  video.play().catch(() => {});
  scanning = true;
  requestAnimationFrame(tick);
}

function tick() {
  if (!scanning) return;
  if (video.readyState >= 2 && video.videoWidth) {
    const scale = Math.min(1, 480 / Math.max(video.videoWidth, video.videoHeight));
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (code && code.data) {
      const id = extractVideoId(code.data);
      if (id) {
        scanning = false;
        if (navigator.vibrate) navigator.vibrate(80);
        playVideo(id);
        return;
      } else if (Date.now() - lastErrorAt > 1500) {
        lastErrorAt = Date.now();
        $('scanMsg').innerHTML = 'YouTubeの<br>QRコードでは<br>ありません';
        $('scanMsg').classList.add('error');
      }
    }
  }
  requestAnimationFrame(tick);
}

let watchTimer = null, returning = false;

// iPhoneでは終了イベントが届かないことがあるため、1秒ごとに再生位置も確認する
function startWatch() {
  stopWatch();
  let lastTime = -1, stuckCount = 0;
  watchTimer = setInterval(() => {
    if (!player || typeof player.getCurrentTime !== 'function') return;
    let state, t, d;
    try { state = player.getPlayerState(); t = player.getCurrentTime(); d = player.getDuration(); } catch (e) { return; }
    if (state === YT.PlayerState.PLAYING) $('tapHint').style.display = 'none';
    if (state === YT.PlayerState.ENDED) { backToScan(); return; }
    if (d > 0 && t > 0) {
      // 終わり1秒以内で再生位置が止まったら終了とみなす
      if (t >= d - 1 && Math.abs(t - lastTime) < 0.05) {
        if (++stuckCount >= 2) { backToScan(); return; }
      } else {
        stuckCount = 0;
      }
    }
    lastTime = t;
  }, 1000);
}
// 字幕を消す（動画側で字幕が自動表示される設定でも消す）
function hideCaptions() {
  if (!player) return;
  try { player.setOption('captions', 'track', {}); } catch (e) {}
  try { player.unloadModule('captions'); } catch (e) {}
  try { player.unloadModule('cc'); } catch (e) {}
}
function stopWatch() { if (watchTimer) { clearInterval(watchTimer); watchTimer = null; } }

function resetPlayer() {
  stopWatch();
  if (player) { try { player.destroy(); } catch (e) {} player = null; }
  $('player-wrap').innerHTML = '<div id="player"></div>';
}

function playVideo(id) {
  show('play');
  $('tapHint').style.display = 'block';
  if (!ytReady) { pendingId = id; return; }
  pendingId = null;
  resetPlayer();
  player = new YT.Player('player', {
    videoId: id,
    playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, fs: 0, enablejsapi: 1, origin: location.origin,
      cc_load_policy: 0, iv_load_policy: 3 },
    events: {
      onReady: e => { hideCaptions(); e.target.playVideo(); startWatch(); },
      onApiChange: () => hideCaptions(),
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) { $('tapHint').style.display = 'none'; hideCaptions(); }
        if (e.data === YT.PlayerState.ENDED) backToScan();
      },
      onError: () => {
        backToScan();
        setTimeout(() => {
          $('scanMsg').innerHTML = 'この動画は<br>再生できません<br><small>（埋め込み禁止の可能性）</small>';
          $('scanMsg').classList.add('error');
        }, 50);
      }
    }
  });
}

function backToScan() {
  if (returning) return;
  returning = true;
  resetPlayer();
  startScanning().finally(() => { returning = false; });
}

$('startBtn').addEventListener('click', startScanning);
$('backBtn').addEventListener('click', backToScan);

// アプリ切替などから戻ったときにカメラ映像が止まっていたら再開
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && $('scan').classList.contains('active')) startScanning();
});
</script>
</body>
</html>
